name: Verify code
run-name: Verify code in branch [${{ github.ref }}] by @${{ github.actor }}

on:
  pull_request:
    branches: [ "main", "dev"]
  push:
    branches:
      - "main"
      - "dev"

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17 ⚙️
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin' # Use 'temurin', 'zulu', etc., as per your requirement



      # Step 3: Cache Maven dependencies to speed up the build
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
               ${{ runner.os }}-maven-

      # Step 4: Build and run tests using Maven
      - name: Build with Maven 🛠️
        run: mvn -B package --file pom.xml

      # Step 5: Run unit tests
      - name: Run tests 🧪
        run: mvn test


